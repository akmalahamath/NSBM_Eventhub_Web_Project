<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>My Registered Events — NSBM Event Hub</title>
    <link rel="stylesheet" href="../css/style.css?v=1.0">
    <link rel="stylesheet" href="../css/animations.css?v=1.0">
    <link rel="stylesheet" href="../css/responsive.css?v=1.0">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container-fluid">
            <nav class="navbar">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <button class="sidebar-toggle-btn" aria-label="Toggle Navigation Menu" type="button">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <a href="../index.html" class="navbar-brand">
                        <img src="../images/NSBM-LOGO.png" alt="NSBM Green University Town" class="navbar-logo">
                        <div class="brand-text">NSBM <span>StudentHub</span></div>
                    </a>
                </div>

                <div class="nav-actions">
                    <button class="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
                        <i class="bi bi-sun-fill"></i>
                    </button>
                    <a href="../index.html" class="btn btn-glass btn-sm nav-extra-btn" title="Go to Public Website Home"><i class="bi bi-house-door"></i> Go to Home</a>
                    <a href="events.html" class="btn btn-secondary btn-sm nav-extra-btn"><i class="bi bi-compass"></i> Discover Events</a>
                    <button onclick="handleGlobalLogout()" class="btn btn-glass btn-sm" title="Sign Out">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </nav>
        </div>
    </header>
    <div class="sidebar-backdrop"></div>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar">
                    <i class="bi bi-person"></i>
                </div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name user-name-display">Loading...</div>
                    <div class="sidebar-user-role user-studentid-display">Student</div>
                </div>
                <button class="sidebar-close-btn" aria-label="Close menu" type="button">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
                <li><a href="events.html" class="sidebar-link"><i class="bi bi-compass"></i> Discover Events</a></li>
                <li><a href="my-events.html" class="sidebar-link active"><i class="bi bi-ticket-perforated"></i> My Events</a></li>
                <li><a href="schedule.html" class="sidebar-link"><i class="bi bi-calendar-range"></i> My Schedule</a></li>
                <li><a href="profile.html" class="sidebar-link"><i class="bi bi-person-gear"></i> My Profile</a></li>
                <li style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-glass);"><a href="../index.html" class="sidebar-link"><i class="bi bi-house"></i> Public Home</a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="dashboard-content">
            <div class="section-header" style="text-align: left; margin-bottom: 2rem;">
                <span class="section-tag"><i class="bi bi-ticket-detailed"></i> Student Registration Portal</span>
                <h1 class="section-title">My Registered Events</h1>
                <p class="section-subtitle">Manage your event bookings, generate digital QR tickets, or cancel seats.</p>
            </div>

            <!-- Filter Tabs -->
            <div style="display: flex; gap: 0.75rem; margin-bottom: 2rem; flex-wrap: wrap;">
                <button onclick="filterMyEvents('all', this)" class="btn btn-primary btn-sm btn-pill filter-tab active">All Events</button>
                <button onclick="filterMyEvents('confirmed', this)" class="btn btn-secondary btn-sm btn-pill filter-tab">Confirmed / Active</button>
                <button onclick="filterMyEvents('attended', this)" class="btn btn-secondary btn-sm btn-pill filter-tab">Attended</button>
                <button onclick="filterMyEvents('cancelled', this)" class="btn btn-secondary btn-sm btn-pill filter-tab">Cancelled</button>
            </div>

            <!-- Registered Events List -->
            <div id="myEventsList" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <!-- Populated via JavaScript -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/main.js?v=1.0"></script>
    <script src="../js/auth.js?v=1.0"></script>
    <script src="../js/registration.js?v=1.0"></script>
    <script src="../js/qrcode.min.js?v=1.0"></script>
    <script>
        let currentFilter = 'all';

        function filterMyEvents(status, btn) {
            document.querySelectorAll('.filter-tab').forEach(t => {
                t.className = 'btn btn-secondary btn-sm btn-pill filter-tab';
            });
            btn.className = 'btn btn-primary btn-sm btn-pill filter-tab active';
            currentFilter = status;
            loadMyRegisteredEvents(status);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await enforceAuthGuard('student');
            if (user) {
                loadMyRegisteredEvents('all');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — NSBM Event Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh;">

    <!-- Sticky Glass Navigation Bar -->
    <header class="site-header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="navbar-brand">
                    <img src="images/NSBM-LOGO.png" alt="NSBM Green University Town" class="navbar-logo">
                    <div class="brand-text">NSBM <span>EventHub</span></div>
                </a>

                <div class="nav-actions">
                    <button class="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
                        <i class="bi bi-sun-fill"></i>
                    </button>
                    <a href="index.html" class="btn btn-glass btn-sm"><i class="bi bi-arrow-left"></i> Back to Home</a>
                    <a href="register.html" class="btn btn-secondary btn-sm">Create Account</a>
                </div>
            </nav>
        </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
        <div class="glass-panel animate-fade-up" style="max-width: 440px; width: 100%; padding: 2.5rem; position: relative;">
            
            <!-- Back Option Link -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
                <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--text-secondary); text-decoration: none;">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
                <a href="register.html" style="font-size: 0.85rem; color: var(--text-secondary); text-decoration: none;">
                    Register <i class="bi bi-arrow-right"></i>
                </a>
            </div>

            <div class="text-center" style="margin-bottom: 2rem;">
                <img src="images/NSBM-LOGO.png" alt="NSBM Green University Town" class="navbar-logo">
                <h2 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Welcome Back</h2>
                <p class="text-secondary" style="font-size: 0.92rem;">Sign in to access your event passes and schedule.</p>
            </div>

            <!-- Demo Access Removed -->

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLoginFormSubmit(event, 'student')">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" name="email" class="form-control" placeholder="name@nsbmeventhub.com" required autocomplete="email">
                    <div class="form-feedback"></div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
                        <a href="admin/login.html" class="text-secondary" style="font-size: 0.8rem;">Admin Portal?</a>
                    </div>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="form-feedback"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
                    Sign In <i class="bi bi-box-arrow-in-right"></i>
                </button>
            </form>

            <div class="text-center" style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                Don't have an account? <a href="register.html" class="text-primary font-bold">Register here</a>
            </div>
        </div>
    </main>

    <!-- Footer Bottom Only -->
    <footer style="text-align: center; padding: 1.5rem; border-top: 1px solid var(--border-glass); font-size: 0.85rem; color: var(--text-muted);">
        &copy; 2026 NSBM Event Hub. All Rights Reserved.
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // If already logged in, redirect to the right dashboard
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_BASE}auth/check_session.php`);
                const json = await res.json();
                if (json.success && json.data.authenticated) {
                    const role = json.data.user.role;
                    window.location.href = role === 'admin' ? 'admin/dashboard.html' : 'index.html';
                }
            } catch (e) {
                // Not logged in or error — stay on login page
            }
        });
    </script>
</body>
</html>
